# Lexonia Pro Clean — Netlify configuration (this file sits above the published site/ folder, so it is never served)
[build]
  publish = "site"
  # Netlify builds the site from the generator on every push (Oct 18 2026), so a blog article can be added as one Markdown file.
  # Articles go live on their date (US Central): the weekly publisher pushes on that day.
  command = "python3 generator/build_site.py site deploy"

[build.environment]
  PYTHON_VERSION = "3.12"

# Security headers on every page and file (Clarity analytics domains allowed in script-src, img-src and connect-src; no inline scripts)
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://www.clarity.ms https://*.clarity.ms https://c.bing.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.clarity.ms https://c.bing.com; font-src 'self'; media-src 'self'; connect-src 'self' https://*.clarity.ms https://c.bing.com; form-action 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests"

# Faster repeat visits on phones: photos, logos and music are cached for a week, fonts for a year
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/audio/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/favicon.ico"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Price cards are pictures, kept out of search and image indexes (robots.txt also disallows the folder)
[[headers]]
  for = "/img/pricing/*"
  [headers.values]
    X-Robots-Tag = "noindex, noimageindex"

# Visitors from India see a short "not available in your region" page at every address (owner decision, Oct 19 2026: local Twin Cities business).
# Netlify matches the visitor's country at its edge. To block another country, add its two-letter code to the list, e.g. ["IN", "PK"].
# The page lives in generator/assets_src/unavailable.html (no scripts, no contact details, not indexed).
[[redirects]]
  from = "/*"
  to = "/unavailable.html"
  status = 404
  force = true
  conditions = {Country = ["IN"]}
